<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#315F64"
  >

  <title>Escáner QR — Inventario de Activo Fijo</title>

  <style>
    :root {
      --fondo:#EEF2F3;
      --superficie:#FFFFFF;
      --superficie-suave:#F6F8F8;
      --texto:#26383E;
      --texto-suave:#687B82;
      --borde:#C9D4D7;
      --primario:#315F64;
      --primario-oscuro:#254B50;
      --exito:#326B48;
      --error:#963F43;
      --aviso:#806520;
      --sombra:0 18px 50px rgba(38,56,62,.16);

      font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

      color-scheme:light;
    }


    * {
      box-sizing:border-box;
    }


    html,
    body {
      margin:0;
      width:100%;
      min-height:100%;
    }


    body {
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:18px;

      color:var(--texto);
      background:var(--fondo);
    }


    button {
      font:inherit;
      -webkit-tap-highlight-color:transparent;
    }


    .app {
      width:min(640px,100%);

      overflow:hidden;

      background:var(--superficie);

      border:
        1px solid
        var(--borde);

      border-radius:16px;

      box-shadow:
        var(--sombra);
    }


    .cabecera {
      padding:17px 18px;

      display:flex;
      align-items:center;

      gap:13px;

      background:
        var(--superficie);

      border-bottom:
        1px solid
        var(--borde);
    }


    .marca {
      width:45px;
      height:45px;

      flex:
        0 0 45px;

      display:grid;
      place-items:center;

      color:#FFFFFF;

      background:
        var(--primario);

      border-radius:10px;

      font-size:12px;
      font-weight:900;

      letter-spacing:.5px;
    }


    .cabecera-texto {
      min-width:0;
    }


    h1 {
      margin:0;

      color:
        var(--texto);

      font-size:18px;

      line-height:1.2;

      font-weight:850;
    }


    .sub {
      margin-top:4px;

      color:
        var(--texto-suave);

      font-size:11px;

      line-height:1.45;
    }


    .contenido {
      padding:16px;
    }


    .lector-contenedor {
      position:relative;

      width:100%;

      min-height:320px;

      overflow:hidden;

      background:#111;

      border:
        1px solid
        #AEBFC3;

      border-radius:12px;
    }


    #reader {
      width:100%;
      min-height:320px;
    }


    .estado {
      min-height:48px;

      margin-top:13px;

      padding:
        10px 13px;

      display:flex;
      align-items:center;
      justify-content:center;

      text-align:center;

      color:
        var(--texto-suave);

      background:
        var(--superficie-suave);

      border:
        1px solid
        var(--borde);

      border-radius:9px;

      font-size:11px;
      font-weight:700;

      line-height:1.45;
    }


    .estado.ok {
      color:
        var(--exito);

      background:
        #F0F7F2;

      border-color:
        #A9C9B5;
    }


    .estado.error {
      color:
        var(--error);

      background:
        #FBF2F3;

      border-color:
        #D8B3B7;
    }


    .estado.pendiente {
      color:
        var(--aviso);

      background:
        #FFF9EC;

      border-color:
        #DCC999;
    }


    .acciones {
      padding:
        0 16px 16px;

      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:9px;
    }


    button {
      min-height:47px;

      padding:
        9px 14px;

      cursor:pointer;

      border-radius:8px;

      font-size:10px;
      font-weight:900;

      letter-spacing:.2px;

      touch-action:manipulation;
    }


    button:disabled {
      cursor:not-allowed;
      opacity:.55;
    }


    #btnIniciar {
      color:#FFFFFF;

      background:
        var(--primario);

      border:
        1px solid
        var(--primario);
    }


    #btnIniciar:hover:not(:disabled) {
      background:
        var(--primario-oscuro);

      border-color:
        var(--primario-oscuro);
    }


    #btnCerrar {
      color:
        var(--primario);

      background:#FFFFFF;

      border:
        1px solid
        #9FB3B8;
    }


    .nota {
      padding:
        0 17px 17px;

      color:
        #75878D;

      font-size:9px;

      line-height:1.5;

      text-align:center;
    }


    .oculto {
      display:none!important;
    }


    @media(max-width:600px) {

      body {
        padding:0;
        align-items:stretch;
      }


      .app {
        width:100%;
        min-height:100vh;

        border:0;
        border-radius:0;

        box-shadow:none;
      }


      .cabecera {
        padding:
          max(
            13px,
            env(safe-area-inset-top)
          )
          14px
          13px;
      }


      h1 {
        font-size:16px;
      }


      .contenido {
        padding:12px;
      }


      .lector-contenedor,
      #reader {
        min-height:58vh;
      }


      .acciones {
        padding:
          0 12px
          max(
            12px,
            env(safe-area-inset-bottom)
          );

        grid-template-columns:1fr;
      }


      button {
        min-height:52px;
        font-size:11px;
      }


      .nota {
        padding:
          0 14px 16px;
      }

    }
  </style>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>
</head>


<body>

  <main class="app">

    <header class="cabecera">

      <div
        class="marca"
        aria-hidden="true"
      >
        AF
      </div>


      <div class="cabecera-texto">

        <h1>
          ESCANEAR QR DEL BIEN
        </h1>

        <div class="sub">
          Apunta la cámara trasera al código QR.
          Al detectarlo regresarás automáticamente
          a la aplicación.
        </div>

      </div>

    </header>


    <div class="contenido">

      <div class="lector-contenedor">

        <div id="reader"></div>

      </div>


      <div
        id="estado"
        class="estado pendiente"
      >
        Preparando lector QR…
      </div>

    </div>


    <div class="acciones">

      <button
        id="btnIniciar"
        type="button"
      >
        ACTIVAR CÁMARA
      </button>


      <button
        id="btnCerrar"
        type="button"
      >
        REGRESAR
      </button>

    </div>


    <div class="nota">
      Este lector no consulta ni modifica la base de datos.
      Únicamente lee el código QR y devuelve el número
      de inventario a la aplicación que lo abrió.
    </div>

  </main>


  <script>
    'use strict';


    // ======================================================
    // ESTADO DEL LECTOR
    // ======================================================

    let ESCANER = null;

    let INICIADO = false;

    let FINALIZANDO = false;


    // ======================================================
    // PARÁMETROS DE ENTRADA
    //
    // MODO ACTUAL:
    //
    // ?nonce=XXXXX&origen=INVENTARIO_AF
    //
    // Devuelve:
    //
    // window.opener.postMessage({
    //   tipo: 'INVENTARIO_AF_QR',
    //   nonce: XXXXX,
    //   valor: INVENTARIO
    // })
    //
    //
    // COMPATIBILIDAD ANTERIOR:
    //
    // ?return=https://script.google.com/...
    //
    // Devuelve mediante redirección:
    //
    // ?inventario=XXXXX
    // ======================================================

    const PARAMS =
      new URLSearchParams(
        window.location.search
      );


    const NONCE =
      String(
        PARAMS.get(
          'nonce'
        ) || ''
      )
        .trim();


    const ORIGEN_SOLICITANTE =
      String(
        PARAMS.get(
          'origen'
        ) || ''
      )
        .trim();


    const RETURN_URL =
      String(
        PARAMS.get(
          'return'
        ) || ''
      )
        .trim();


    // ======================================================
    // INICIO
    // ======================================================

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        document
          .getElementById(
            'btnIniciar'
          )
          .addEventListener(
            'click',
            iniciarCamara
          );


        document
          .getElementById(
            'btnCerrar'
          )
          .addEventListener(
            'click',
            regresarSinLectura
          );


        if (
          !existeCanalRetorno()
        ) {

          mostrarEstado(
            'Este lector debe abrirse desde Inventario de Activo Fijo o Consulta Rápida.',
            'error'
          );

          return;
        }


        /*
         * Intentamos abrir automáticamente la cámara.
         *
         * Algunos navegadores permiten esta operación.
         * Otros requieren una pulsación del usuario.
         *
         * En ese caso permanece disponible:
         *
         * ACTIVAR CÁMARA
         */

        setTimeout(
          iniciarCamara,
          300
        );

      }
    );


    // ======================================================
    // COMPROBAR CANAL DE RETORNO
    // ======================================================

    function existeCanalRetorno() {

      if (
        NONCE &&
        existeVentanaOrigen()
      ) {

        return true;
      }


      if (
        returnUrlValida(
          RETURN_URL
        )
      ) {

        return true;
      }


      return false;
    }


    function existeVentanaOrigen() {

      try {

        return Boolean(
          window.opener &&
          !window.opener.closed
        );

      }
      catch (error) {

        return false;
      }
    }


    // ======================================================
    // INICIAR CÁMARA
    // ======================================================

    async function iniciarCamara() {

      if (
        INICIADO ||
        FINALIZANDO
      ) {

        return;
      }


      if (
        !existeCanalRetorno()
      ) {

        mostrarEstado(
          'No existe una aplicación válida a la cual regresar el resultado.',
          'error'
        );

        return;
      }


      if (
        typeof Html5Qrcode ===
        'undefined'
      ) {

        mostrarEstado(
          'No fue posible cargar el lector QR. Verifica la conexión a Internet.',
          'error'
        );

        return;
      }


      INICIADO =
        true;


      bloquearBotonCamara(
        true
      );


      mostrarEstado(
        'Solicitando permiso para utilizar la cámara…',
        'pendiente'
      );


      try {

        ESCANER =
          new Html5Qrcode(
            'reader'
          );


        await ESCANER.start(

          {
            facingMode:
              'environment'
          },

          {

            fps:
              10,


            qrbox:
              function(
                ancho,
                alto
              ) {

                const lado =
                  Math.floor(
                    Math.min(
                      ancho,
                      alto
                    ) *
                    .72
                  );


                return {

                  width:
                    lado,

                  height:
                    lado

                };

              },


            aspectRatio:
              1.333333

          },


          codigoDetectado,


          function() {

            /*
             * Es completamente normal recibir cuadros
             * de cámara donde todavía no existe un QR.
             */

          }

        );


        mostrarEstado(
          'Cámara activa. Apunta al código QR del bien.',
          ''
        );

      }

      catch (error) {

        INICIADO =
          false;


        bloquearBotonCamara(
          false
        );


        let mensaje =
          'No fue posible iniciar la cámara.';


        const textoError =
          String(
            error &&
            error.message
              ? error.message
              : error || ''
          )
            .toLowerCase();


        if (
          textoError.includes(
            'permission'
          ) ||
          textoError.includes(
            'notallowed'
          ) ||
          textoError.includes(
            'denied'
          )
        ) {

          mensaje =
            'No se concedió permiso para utilizar la cámara. ' +
            'Pulsa ACTIVAR CÁMARA y autoriza el acceso cuando el navegador lo solicite.';

        }


        if (
          textoError.includes(
            'notfound'
          ) ||
          textoError.includes(
            'devicesnotfound'
          )
        ) {

          mensaje =
            'No se encontró una cámara disponible en este dispositivo.';

        }


        mostrarEstado(
          mensaje,
          'error'
        );

      }

    }


    // ======================================================
    // QR DETECTADO
    // ======================================================

    async function codigoDetectado(
      texto
    ) {

      if (
        FINALIZANDO
      ) {

        return;
      }


      const inventario =
        normalizarValorQr(
          texto
        );


      if (!inventario) {

        return;
      }


      FINALIZANDO =
        true;


      bloquearBotonCamara(
        true
      );


      mostrarEstado(
        'QR detectado: ' +
        inventario +
        '. Regresando a la aplicación…',
        'ok'
      );


      await detenerCamara();


      entregarInventario(
        inventario
      );

    }


    // ======================================================
    // NORMALIZAR CONTENIDO DEL QR
    //
    // ACEPTA:
    //
    // 5111000012-891
    //
    // o una URL como:
    //
    // https://sitio/?inventario=5111000012-891
    // ======================================================

    function normalizarValorQr(
      texto
    ) {

      const valor =
        String(
          texto || ''
        )
          .trim();


      if (!valor) {

        return '';

      }


      try {

        const url =
          new URL(
            valor
          );


        const numero =
          url.searchParams.get(
            'inventario'
          );


        if (
          numero
        ) {

          return String(
            numero
          )
            .trim();

        }

      }

      catch (error) {

        /*
         * No es una URL.
         * Probablemente el QR contiene directamente
         * el número de inventario.
         */

      }


      return valor;

    }


    // ======================================================
    // ENTREGAR RESULTADO
    //
    // PRIORIDAD:
    //
    // 1. postMessage + nonce
    // 2. return URL heredada
    // ======================================================

    function entregarInventario(
      inventario
    ) {

      if (
        NONCE &&
        existeVentanaOrigen()
      ) {

        try {

          window.opener
            .postMessage(
              {

                tipo:
                  'INVENTARIO_AF_QR',

                nonce:
                  NONCE,

                valor:
                  inventario,

                origen:
                  ORIGEN_SOLICITANTE ||
                  'INVENTARIO_AF'

              },

              '*'
            );


          /*
           * Damos un pequeño margen para que el navegador
           * entregue postMessage antes de cerrar la ventana.
           */

          setTimeout(
            function() {

              cerrarVentanaLector();

            },
            220
          );


          return;

        }

        catch (error) {

          /*
           * Si postMessage falla y existe RETURN_URL,
           * utilizamos el método anterior como respaldo.
           */

        }

      }


      if (
        returnUrlValida(
          RETURN_URL
        )
      ) {

        regresarConInventarioUrl(
          inventario
        );

        return;
      }


      FINALIZANDO =
        false;


      bloquearBotonCamara(
        false
      );


      mostrarEstado(
        'El QR fue leído, pero no fue posible devolverlo a la aplicación.',
        'error'
      );

    }


    // ======================================================
    // RETORNO HEREDADO POR URL
    // ======================================================

    function regresarConInventarioUrl(
      inventario
    ) {

      if (
        !returnUrlValida(
          RETURN_URL
        )
      ) {

        mostrarEstado(
          'QR leído, pero no fue posible regresar a la aplicación.',
          'error'
        );

        return;
      }


      try {

        const url =
          new URL(
            RETURN_URL
          );


        url.searchParams.set(
          'inventario',
          inventario
        );


        window.location.replace(
          url.toString()
        );

      }

      catch (error) {

        FINALIZANDO =
          false;


        bloquearBotonCamara(
          false
        );


        mostrarEstado(
          'El QR fue leído, pero ocurrió un error al regresar a la aplicación.',
          'error'
        );

      }

    }


    // ======================================================
    // REGRESAR SIN LEER
    // ======================================================

    async function regresarSinLectura() {

      if (
        FINALIZANDO
      ) {

        return;
      }


      FINALIZANDO =
        true;


      await detenerCamara();


      if (
        NONCE &&
        existeVentanaOrigen()
      ) {

        cerrarVentanaLector();

        return;
      }


      if (
        returnUrlValida(
          RETURN_URL
        )
      ) {

        window.location.replace(
          RETURN_URL
        );

        return;
      }


      try {

        history.back();

      }

      catch (error) {

        FINALIZANDO =
          false;

      }

    }


    // ======================================================
    // CERRAR VENTANA DEL LECTOR
    // ======================================================

    function cerrarVentanaLector() {

      try {

        window.close();

      }

      catch (error) {}


      /*
       * Si el navegador impide window.close(),
       * intentamos regresar al historial.
       */

      setTimeout(
        function() {

          try {

            if (
              !window.closed
            ) {

              history.back();

            }

          }

          catch (error) {}

        },
        180
      );

    }


    // ======================================================
    // VALIDAR RETURN URL
    //
    // Conservamos compatibilidad con el mecanismo anterior.
    // Solamente se permiten URLs HTTPS de Apps Script.
    // ======================================================

    function returnUrlValida(
      valor
    ) {

      if (!valor) {

        return false;
      }


      try {

        const url =
          new URL(
            valor
          );


        if (
          url.protocol !==
          'https:'
        ) {

          return false;
        }


        return (

          url.hostname ===
            'script.google.com' ||

          url.hostname.endsWith(
            '.script.google.com'
          )

        );

      }

      catch (error) {

        return false;
      }

    }


    // ======================================================
    // DETENER CÁMARA
    // ======================================================

    async function detenerCamara() {

      try {

        if (
          ESCANER &&
          ESCANER.isScanning
        ) {

          await ESCANER.stop();

        }

      }

      catch (error) {

        /*
         * No crítico.
         */

      }


      try {

        if (
          ESCANER
        ) {

          await ESCANER.clear();

        }

      }

      catch (error) {

        /*
         * No crítico.
         */

      }


      INICIADO =
        false;


      ESCANER =
        null;

    }


    // ======================================================
    // BOTÓN DE CÁMARA
    // ======================================================

    function bloquearBotonCamara(
      bloquear
    ) {

      const boton =
        document.getElementById(
          'btnIniciar'
        );


      if (
        boton
      ) {

        boton.disabled =
          Boolean(
            bloquear
          );

      }

    }


    // ======================================================
    // ESTADO
    // ======================================================

    function mostrarEstado(
      mensaje,
      tipo
    ) {

      const elemento =
        document.getElementById(
          'estado'
        );


      if (!elemento) {

        return;
      }


      elemento.className =
        'estado' +
        (
          tipo
            ? ' ' +
              tipo
            : ''
        );


      elemento.textContent =
        mensaje || '';

    }


    // ======================================================
    // LIMPIEZA AL CERRAR
    // ======================================================

    window.addEventListener(
      'pagehide',
      function() {

        if (
          ESCANER
        ) {

          detenerCamara();

        }

      }
    );

  </script>

</body>
</html>
